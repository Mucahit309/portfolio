<section id="testimonials" class="testimonials-section">
  <div class="testimonials-container">
    <h2 class="section-title">What my colleagues say about me</h2>

    <div class="carousel-wrapper">
      <div class="carousel-track">
        <div class="static-quote">
          <img src="assets/testimonials/quotes.svg" alt="Quote">
        </div>
        
        @for (item of testimonials; track item.id; let i = $index) {
          <div class="testimonial-card"
               [class.active]="i === currentIndex"
               [class.prev]="i === prevIndex"
               [class.next]="i === nextIndex"
               (click)="handleCardClick(i)">
            
            <p class="quote-text">{{ item.text }}</p>
            
            <div class="author-section">
              <div class="divider"></div>
              <div class="author-info">
                <h4 class="author">{{ item.author }}</h4>
                <span class="role">{{ item.role }}</span>
              </div>
            </div>
            
          </div>
        }
      </div>
    </div>

    <div class="controls-container">
      <button class="nav-btn prev-btn" (click)="prev()">
        <img src="assets/buttons/left.png" class="default-img" alt="Previous">
        <img src="assets/buttons/left-hover.png" class="hover-img" alt="Previous">
      </button>

      <div class="dots-wrapper">
        @for (item of testimonials; track item.id; let i = $index) {
          <div class="dot" [class.active]="i === currentIndex" (click)="goTo(i)"></div>
        }
      </div>

      <button class="nav-btn next-btn" (click)="next()">
        <img src="assets/buttons/right.png" class="default-img" alt="Next">
        <img src="assets/buttons/right-hover.png" class="hover-img" alt="Next">
      </button>
    </div>
  </div>
</section>
