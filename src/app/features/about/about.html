<section id="about" class="about-section">
  <div class="about-container">
    <div class="about-image-wrapper">
      <img src="assets/aboutme/Capa_1.png" alt="" class="about-image-bg">
      <img src="assets/aboutme/Photo.png" alt="Profile" class="about-photo">
    </div>

    <div class="about-content">
      <span class="who-i-am">{{ 'ABOUT.WHO_I_AM' | translate }}</span>
      <div class="about-text-box">
        <h2 class="section-title">{{ 'ABOUT.TITLE' | translate }}</h2>
        
        <p class="about-description">
          {{ 'ABOUT.DESCRIPTION' | translate }}
        </p>

        <ul class="about-list">
          <li class="about-list-item">
            <img src="assets/aboutme/location_on.svg" alt="Location" class="list-icon">
            <span>{{ 'ABOUT.LIST.LOCATION' | translate }}</span>
          </li>
          <li class="about-list-item">
            <img src="assets/aboutme/cognition.svg" alt="Mind" class="list-icon">
            <span>{{ 'ABOUT.LIST.LEARNING' | translate }}</span>
          </li>
          <li class="about-list-item">
            <img src="assets/aboutme/new_releases.svg" alt="Approach" class="list-icon">
            <span>{{ 'ABOUT.LIST.PROBLEM_SOLVING' | translate }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
